name: Build Magic GL.iNet 4.x Firmware for JDCloud-1

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com
  REPO_BRANCH: main
  DIY_SH: diy.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file jq
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone source code
        run: |
          git clone -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          # 按照官方指南执行 setup.py 配置平台
          python3 setup.py -n mt7621 || true

      - name: 魔改硬件定义设备树 (DTS)
        run: |
          cd openwrt/openwrt-21.02/target/linux/ramips/dts/
          # 强行解除并转换网络接口与GPIO布局
          sed -i 's/gpios = <\&gpio0 14/gpios = <\&gpio0 14/g' mt7621_glinet_gl-mt1300.dts
          sed -i 's/phy-handle = <\&phy0/phy-handle = <\&ethphy4/g' mt7621_glinet_gl-mt1300.dts

      - name: 注入固件可选配方与强行解锁
        run: |
          cd openwrt/openwrt-21.02/
          make defconfig
          # 强行扩展分区至 57344k 破除原厂 32M 限制，并注入 eMMC 核心驱动与魔改组件
          sed -i 's/IMAGE_SIZE := 32448k/IMAGE_SIZE := 57344k/g' target/linux/ramips/image/mt7621.mk
          echo "CONFIG_PACKAGE_kmod-mmc=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sdhci=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sdhci-mtk=y" >> .config
          echo "CONFIG_PACKAGE_gl-cloud-component=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openvpn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_glinet_gl-mt1300=y" >> .config
          make defconfig
